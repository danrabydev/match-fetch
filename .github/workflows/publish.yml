name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.version.outputs.skip != 'true' }}
      package: ${{ steps.version.outputs.package }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm ≥ 11.5.1; Node 24 ships a recent enough CLI.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip if version already on npm
        id: version
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing ${VERSION}."
          fi

      # Auth via npm Trusted Publisher (OIDC). Do not set NODE_AUTH_TOKEN —
      # an empty token overrides OIDC and fails the publish.
      - name: Publish to npm with provenance
        if: steps.version.outputs.skip != 'true'
        run: npm publish --access public --provenance

  notify-site:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/notify-site.yml
    with:
      registry: npm
      package: ${{ needs.publish.outputs.package }}
      version: ${{ needs.publish.outputs.version }}
      repo: ${{ github.server_url }}/${{ github.repository }}
    secrets:
      COM_DANRABY_DISPATCH_TOKEN: ${{ secrets.COM_DANRABY_DISPATCH_TOKEN }}

