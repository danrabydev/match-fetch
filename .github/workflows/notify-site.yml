# Language-agnostic: call after any npm / crates / NuGet (or other) publish.
# Copied into each package repo from templates/package — or used via
#   uses: danrabydev/com-danraby/.github/workflows/notify-site.yml@master
# when that repo can access this one.
name: Notify site

on:
  workflow_call:
    inputs:
      registry:
        description: npm, nuget, or crates
        required: true
        type: string
      package:
        description: Registry package id
        required: true
        type: string
      version:
        description: Published version
        required: true
        type: string
      repo:
        description: Source repo URL (optional)
        required: false
        type: string
        default: ""
      site_repo:
        description: Site repo that owns /publish
        required: false
        type: string
        default: danrabydev/com-danraby
    secrets:
      COM_DANRABY_DISPATCH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      registry:
        type: choice
        options: [npm, nuget, crates]
        default: npm
      package:
        required: true
        type: string
      version:
        required: true
        type: string
      repo:
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch package-published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: repository_dispatch com-danraby
        env:
          GH_TOKEN: ${{ secrets.COM_DANRABY_DISPATCH_TOKEN }}
          SITE_REPO: ${{ inputs.site_repo || 'danrabydev/com-danraby' }}
          REGISTRY: ${{ inputs.registry }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "COM_DANRABY_DISPATCH_TOKEN is missing."
            exit 1
          fi
          if [ -z "${PACKAGE:-}" ] || [ -z "${VERSION:-}" ]; then
            echo "package and version are required."
            exit 1
          fi
          payload="$(jq -n \
            --arg registry "$REGISTRY" \
            --arg package "$PACKAGE" \
            --arg version "$VERSION" \
            --arg repo "${REPO:-}" \
            '{
              event_type: "package-published",
              client_payload: {
                registry: $registry,
                package: $package,
                version: $version,
                repo: $repo
              }
            }')"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SITE_REPO}/dispatches" \
            -d "$payload"
          echo "Dispatched package-published for ${REGISTRY} ${PACKAGE}@${VERSION}"
